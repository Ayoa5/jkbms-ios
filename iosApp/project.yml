name: JkBms

options:
  bundleIdPrefix: com.jkbms.ios
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"

targets:
  JkBms:
    type: application
    platform: iOS
    sources:
      - path: JkBms
    info:
      path: JkBms/Info.plist
      properties:
        CFBundleDisplayName: 极空BMS
        UILaunchScreen: {}
        NSBluetoothAlwaysUsageDescription: 需要蓝牙以连接极空 BMS 保护板读取电池数据
        NSBluetoothPeripheralUsageDescription: 需要蓝牙以连接极空 BMS 保护板
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jkbms.ios
        TARGETED_DEVICE_FAMILY: "1"
